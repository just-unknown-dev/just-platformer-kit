name: just_platformer_kit
description: "Platformer components, systems and Level Designer extension for just_game_engine."
version: 0.1.0-beta.1
homepage: https://justunknown.com
publish_to: none

environment:
  sdk: ^3.11.0
  # just_game_engine, just_editor_core and just_game_engine_editor need
  # Flutter GPU as it is from 3.47.1.
  flutter: ">=3.47.1"

dependencies:
  flutter:
    sdk: flutter
  # Physics (RigidBody2D, CharacterBody2D, rays) comes through the engine.
  just_game_engine: ^2.0.0-dev.2

  # Design-time only. `lib/just_platformer_kit.dart` never imports it, so a
  # release build that only touches the runtime library never reaches the
  # editor — the same arrangement the template uses for the editor itself.
  just_editor_core: ^0.1.0-dev.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  collection: ^1.19.0
  # A real editor, for the tests that drive one (platformer_module_test).
  just_game_engine_editor: ^0.1.0-dev.1

flutter:
  uses-material-design: true
