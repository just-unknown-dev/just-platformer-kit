name: just_platformer_kit
description: "Platformer components, systems and Level Designer extension for just_game_engine."
version: 0.1.0
homepage: https://justunknown.com
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  just_game_engine: ^2.0.0
  just_physics_engine: ^1.3.0

  # Design-time only. `lib/just_platformer_kit.dart` never imports it, so a
  # release build that only touches the runtime library never reaches the
  # editor — the same arrangement the template uses for the editor itself.
  just_editor_core: ^0.1.0-dev.1
  just_game_engine_formats: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  collection: ^1.19.0

flutter:
  uses-material-design: true
